[project]
name = "string-lights"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.1",
    "numpy>=1.26,<2",
    "opencv-python>=4.10,<4.12",
    "torch>=2.7",
    "Pillow>=10.0",
    "flask>=3.0",
    "torchvision>=0.15",
    "tqdm>=4.66",
    "sam2matting",
    "huggingface-hub>=1.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
markers = [
    "slow: end-to-end tests over local video fixtures",
]

[project.scripts]
string-lights = "string_lights.__main__:main"

[tool.uv.sources]
sam2matting = { path = "vendor/sam2matting" }
