<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>String Lights Editor</title>
<link rel="stylesheet" href="/static/editor.css">
</head>
<body>

<div id="toolbar">
  <label>Interval (ms) <input type="number" id="interval" value="250" min="1" max="10000" step="1"></label>
  <label>File <select id="filename"></select></label>
  <button id="export-btn">Export .npy</button>
  <button id="clear-btn">Clear</button>
  <span id="status" class="status"></span>
  <span class="hint">click/drag = pluck &nbsp;|&nbsp; right-click = clear &nbsp;|&nbsp; Space = play/pause &nbsp;|&nbsp; ←→ = step interval &nbsp;|&nbsp; Enter = rewind &nbsp;|&nbsp; q w e a s d = toggle string</span>
</div>

<div id="grid-wrap">
  <div id="labels"></div>
  <div id="grid-inner">
    <div id="playhead"></div>
    <div id="time-numbers" class="header-row time-row"></div>
    <div id="rows"></div>
  </div>
</div>

<div id="video-section">
  <div id="video-stage">
    <video id="video" controls></video>
    <canvas id="overlay"></canvas>
  </div>
</div>

<script src="/static/editor.js"></script>
</body>
</html>
