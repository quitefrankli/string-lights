<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>String Lights Editor</title>
<link rel="stylesheet" href="/static/editor.css">
</head>
<body>

<div id="toolbar">
  <label>Seek (ms) <input type="number" id="interval" value="250" min="1" max="10000" step="1"></label>
  <label>Grid (ms) <input type="number" id="grid-interval" value="250" min="1" max="10000" step="any"></label>
  <label><input type="checkbox" id="snap" checked> Snap</label>
  <label>Zoom <input type="range" id="zoom" min="40" max="800" value="80" step="10"></label>
  <label>Video <select id="filename"></select></label>
  <label>Transcription <select id="transcription"></select></label>
  <button id="load-transcription-btn" title="Load the selected .npy without changing the video. Export saves under the video’s name.">Load .npy</button>
  <button id="export-btn">Export .npy</button>
  <button id="clear-btn">Clear</button>
  <details id="advanced">
    <summary>Advanced</summary>
    <div class="advanced-panel">
      <label class="switch-label">
        <input type="checkbox" id="reverse-strings" role="switch">
        <span class="switch-track" aria-hidden="true"></span>
        Reverse strings (E4 ↔ E2)
      </label>
      <strong>Convert transcription tempo</strong>
      <label>Current BPM <input id="source-bpm" type="number" min="1" step="any" value="120"></label>
      <label>Recording BPM <input id="target-bpm" type="number" min="1" step="any" value="120"></label>
      <p>Scales all note timing from the start. The recording stays unchanged. Undo with Ctrl/Cmd+Z.</p>
      <button id="convert-tempo-btn">Apply conversion</button>
    </div>
  </details>
  <span id="status" class="status"></span>
  <span class="hint">click = toggle pluck · drag note = move · Alt = free timing · right-click = remove · Space = play/pause · ←→ = seek · q w e r t y = strings · Ctrl/Cmd+Z = undo</span>
</div>

<div id="grid-wrap">
  <div id="labels"></div>
  <div id="grid-inner">
    <div id="playhead"></div>
    <div id="selection"></div>
    <div id="time-numbers" class="header-row time-row"></div>
    <div id="rows"></div>
  </div>
</div>

<div id="video-section">
  <div id="video-stage">
    <video id="video" controls></video>
    <canvas id="overlay"></canvas>
  </div>
</div>

<script src="/static/editor_timing.js"></script>
<script src="/static/editor.js"></script>
</body>
</html>
